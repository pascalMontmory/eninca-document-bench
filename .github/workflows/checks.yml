name: Document contracts and research evidence
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      native_model:
        description: Download pinned model and run native CPU integration checks
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install --no-cache-dir .
      - name: Unit contracts (native model checks are opt-in)
        run: python -m unittest discover -s tests -v
      - name: Verify public data and archived evidence
        run: python scripts/check_records.py
      - name: Download model and check real CPU inference
        if: github.event_name == 'workflow_dispatch' && inputs.native_model
        run: |
          eninca-documents fetch-model --model-dir .models/minilm
          ENINCA_DOCUMENT_MODEL=.models/minilm python -m unittest discover -s tests -v
